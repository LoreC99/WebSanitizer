# =====================================================================
# Web Sanitizer - Policy Permissiva (per test e benchmark)
# =====================================================================

[html]
# Permette gli script (ma il sanitizer rimuoverà comunque gli eventi inline come 'onclick')
allow_scripts = true
remove_iframes = false
# Lista molto più ampia
allowed_tags = [
    # --- STESSI TAG DELLA STRICT ---
    "html", "head", "body", "title", "meta",
    "h1", "h2", "h3", "h4", "h5", "h6",
    "article", "section", "nav", "aside", "header", "footer", "main",
    "p", "hr", "pre", "blockquote", "div", "figure", "figcaption",
    "ol", "ul", "li", "dl", "dt", "dd",
    "a", "em", "strong", "small", "s", "cite", "q", "dfn", "abbr",
    "time", "code", "var", "samp", "kbd", "sub", "sup", "i", "b", "u",
    "mark", "ruby", "rt", "rp", "bdi", "bdo", "span", "br", "wbr",
    "img", "picture", "source",
    "table", "caption", "colgroup", "col", "tbody", "thead", "tfoot", "tr", "td", "th",
    "details", "summary", "dialog",

    # --- TAG ATTIVI E COMPLESSI AGGIUNTI ---

    # Scripting e Stili
    "script", "noscript", "style", "link",

    # Embedding (il PDF cita iframes e object )
    "iframe", "object", "embed", "param",

    # Media avanzati
    "video", "audio", "track", "canvas", "svg", "math",

    # Moduli (Forms)
    "form", "input", "button", "select", "datalist", "optgroup",
    "option", "textarea", "label", "fieldset", "legend", "meter", "progress", "output"
]

[url]
allowed_schemes = ["http", "https", "mailto", "ftp"]
block_data_uris = false
block_javascript_uris = true # Questo lo teniamo sempre bloccato per sicurezza base

[resources]
# Abilitiamo il download per testare il multi-threading e le richieste asincrone!
fetch_resources = true
max_depth = 2
max_resource_size = 10485760 # 10 MB