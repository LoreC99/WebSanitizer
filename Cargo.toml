[package]
name = "WebSanitizer"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3.32"
walkdir = "2.5.0"
toml = "0.8"
config = "0.15.25"
mockito = "1.0"
url = "2.5.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.138" 
